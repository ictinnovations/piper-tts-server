[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-tts-server"
version = "0.1.0"
description = "Paced, streaming Piper (+ElevenLabs) TTS microservice for real-time voice pipelines (Asterisk AudioSocket, RTP, WebSocket)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Tahir Almas", email = "tahir@ictinnovations.com" }]
maintainers = [{ name = "ICT Innovations", email = "info@ictinnovations.com" }]
keywords = ["piper", "tts", "text-to-speech", "asterisk", "audiosocket", "voice", "streaming", "realtime", "voip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Communications :: Telephony",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.2"]
server = ["aiohttp>=3.8"]
elevenlabs = ["httpx>=0.24"]
all = ["piper-tts>=1.2", "aiohttp>=3.8", "httpx>=0.24"]
dev = ["pytest>=7", "aiohttp>=3.8"]

[project.urls]
Homepage = "https://github.com/ictinnovations/piper-tts-server"
Repository = "https://github.com/ictinnovations/piper-tts-server"
"Derived From" = "https://www.ictcontact.com"

[project.scripts]
piper-tts-server = "piper_tts_server.server:run"

[tool.setuptools]
packages = ["piper_tts_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
